[project]
name = "voice-split"
version = "0.3.0"
description = "Local meeting transcription with enrolled speaker matching"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
  "numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1",
  "faster-whisper>=1.1,<2", "speechbrain>=1.0,<2",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch==2.8.0", "torchaudio==2.8.0", "huggingface-hub>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "websockets>=13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
